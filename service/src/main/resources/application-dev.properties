# === DataSource (dev) ===
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lastisland_dev}
spring.datasource.username=${DB_USER:lastisland}
spring.datasource.password=${DB_PASSWORD:dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# === Flyway ===
spring.flyway.enabled=true

# === Connection Pool (HikariCP) ===
spring.datasource.hikari.maximum-pool-size=10

# === JWT ===
app.jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hs256-signing}
app.jwt.access-expiration=3600000
app.jwt.refresh-expiration=604800000

# === Cookies ===
app.cookie.secure=false

# === CORS ===
app.cors.allowed-origins=http://localhost:3000